<div class="modal-overlay">
  <div class="modal-contenedor pdf-viewer">
    <header class="modal-header">
      <h2>Vista Previa de Cotización</h2>
      <div class="acciones">
        <button class="btn-secundario" (click)="editar.emit()">✏️ Editar</button>
        <button class="btn-primario" (click)="descargarPdf()">⬇️ Descargar</button>
        <button class="btn-cerrar" (click)="cerrar.emit()">✕</button>
      </div>
    </header>

    <div class="pdf-body">
      @if (pdfUrl) {
        <iframe [src]="pdfUrl" width="100%" height="100%"></iframe>
      } @else {
        <p>Generando vista previa...</p>
      }
    </div>
  </div>
</div>
