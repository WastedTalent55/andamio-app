<header class="header-seccion">
  <h1>Tablero de Proyectos</h1>
  <button class="btn-nuevo" (click)="abrirModal()">+ Nueva Evaluación</button>
</header>
<div class="contenedor-proyectos">
  <div class="tablero-kanban">
    <section class="columna">
      <div class="columna-header">
        <span class="punto evaluacion"></span>
        <h3>Evaluaciones</h3>
        <span class="contador">{{proyectosEvaluacion.length}}</span>
      </div>
      
      <div class="lista-cards">
  @for (p of proyectosEvaluacion; track p.id) {
    <app-card-proyecto 
      [proyecto]="p" 
      [cliente]="getDatosCliente(p.clienteId)"
      (editar)="editarProyecto($event)"
      (cancelar)="cancelarProyecto($event)"
      (cotizar)="prepararCotizacion($event)">
    </app-card-proyecto>
  }
</div>
    </section>

    <section class="columna">
      <div class="columna-header">
        <span class="punto cotizacion"></span>
        <h3>Cotizaciones</h3>
      </div>
      <div class="lista-cards empty">
        <p>Esperando aprobación...</p>
      </div>
    </section>

    <section class="columna">
      <div class="columna-header">
        <span class="punto obra"></span>
        <h3>En Obra</h3>
      </div>
      <div class="lista-cards empty">
        <p>Próximamente...</p>
      </div>
    </section>
  </div>
</div>

@if (mostrarModal) {
  <div class="modal-overlay">
    <div class="modal-contenedor">
      <app-proyecto-form 
        [proyectoAEditar]="proyectoSeleccionado"
        (proyectoGuardado)="agregarProyectoALista($event)" 
        (cerrar)="cerrarModal()">
      </app-proyecto-form>
    </div>
  </div>
}

@if (mostrarModalCotizacion && proyectoParaCotizar) {
  <div class="modal-overlay">
    <div class="modal-contenedor">
      <app-cotizacion-form 
        [proyecto]="proyectoParaCotizar"
        (cerrar)="cerrarModalCotizacion()"
        (cotizacionGuardada)="actualizarProyectoConCotizacion($event)">
      </app-cotizacion-form>
    </div>
  </div>
}
