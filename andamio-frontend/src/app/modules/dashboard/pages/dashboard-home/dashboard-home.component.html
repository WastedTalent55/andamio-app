<div class="dashboard-container">
  <h1>Panel de Control</h1>
  
  <div class="metrics-grid">
    <div class="card-metric border-blue">
      <label>Por Cobrar</label>
      <span class="value">{{ metrics.totalPorCobrar | currency }}</span>
      <p class="subtitle">Dinero pendiente en calle</p>
    </div>

    <div class="card-metric border-green">
      <label>Utilidad Neta</label>
      <span class="value success">{{ metrics.utilidadTotal | currency }}</span>
      <p class="subtitle">Ganancia real acumulada</p>
    </div>

    <div class="card-metric border-orange">
      <label>Obras Activas</label>
      <span class="value">{{ metrics.obrasActivas }}</span>
      <p class="subtitle">Proyectos en ejecución</p>
    </div>
  </div>

  <section class="proximas-acciones">
    <h3>Estado General de Proyectos</h3>
    </section>
</div>
